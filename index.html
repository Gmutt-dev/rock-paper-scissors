<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script defer src="script.js"></script>
</head>
<body>
    <h1>Rock, Paper, Scissors Game</h1>
    <p>First player with 5 points wins!</p>
    <p>Please select your option:</p>
    <div class = "button-group">
        <button class = "button-rock">Rock</button>
        <button class = "button-paper">Paper</button>
        <button class = "button-scissors">Scissors</button>
    </div>
    <div class = "results">
        <p class = "round-result"></p>
        <div class = "human-score">Human score: <span>0</span></div>
        <div class = "computer-score">Computer score: <span>0</span></div>
        <p class = "winning-result"></p>
    </div>
</body>
</html>
